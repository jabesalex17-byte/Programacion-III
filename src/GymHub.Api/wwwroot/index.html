<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Hub – Socios</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>🏋️ Gym Hub</h1>
    <p>Gestión de socios · Programación III</p>
  </header>

  <main>
    <p id="message" role="alert"></p>

    <section id="formulario">
      <h2 id="form-title">Nuevo socio</h2>
      <form id="socio-form" autocomplete="off">
        <input type="hidden" id="socio-id">
        <label>Nombre <input id="f-firstName" required></label>
        <label>Apellido <input id="f-lastName" required></label>
        <label>Edad <input id="f-age" type="number" required></label>
        <label>Correo <input id="f-email" type="email" required></label>
        <label>Teléfono <input id="f-phoneNumber"></label>
        <label class="check"><input id="f-active" type="checkbox" checked> Activo</label>
        <button type="submit" id="guardar">Agregar socio</button>
        <button type="button" id="cancelar" class="secondary" hidden>Cancelar</button>
      </form>
    </section>

    <section id="lista">
      <h2>Socios</h2>
      <input id="search" type="search" placeholder="Buscar por nombre, apellido o correo…">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Apellido</th><th>Edad</th><th>Correo</th><th>Teléfono</th><th>Activo</th><th></th></tr>
          </thead>
          <tbody id="socios"></tbody>
        </table>
      </div>
      <p id="empty" hidden>No hay socios todavía.</p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/listar.js"></script>
  <script src="/js/crear.js"></script>
  <script src="/js/editar.js"></script>
</body>
</html>
